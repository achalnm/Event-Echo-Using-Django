{% load static %}
<footer style="border-top:1px solid var(--border);padding:28px 0;margin-top:72px;background:var(--surface);">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div style="font-size:1rem;font-weight:900;color:var(--ink);letter-spacing:-0.3px;">EventEcho</div>
            <div class="d-flex gap-3 align-items-center">
                <a href="https://www.instagram.com" target="_blank" style="opacity:0.3;transition:opacity 0.18s;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='0.3'">
                    <img src="{% static 'accounts/LOG1.png' %}" alt="Instagram" style="width:18px;height:18px;object-fit:contain;">
                </a>
                <a href="https://www.linkedin.com" target="_blank" style="opacity:0.3;transition:opacity 0.18s;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='0.3'">
                    <img src="{% static 'accounts/LOG2.png' %}" alt="LinkedIn" style="width:18px;height:18px;object-fit:contain;">
                </a>
                <a href="https://mail.google.com" target="_blank" style="opacity:0.3;transition:opacity 0.18s;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='0.3'">
                    <img src="{% static 'accounts/LOG3.png' %}" alt="Gmail" style="width:18px;height:18px;object-fit:contain;">
                </a>
            </div>
            <div style="color:var(--ink-3);font-size:0.75rem;">EventEcho@gmail.com</div>
        </div>
    </div>
</footer>
