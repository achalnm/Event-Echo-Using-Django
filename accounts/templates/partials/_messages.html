{% if messages %}
<div class="container pt-3">
    {% for message in messages %}
    <div style="background:var(--surface);border:1px solid var(--border-mid);color:var(--ink);border-radius:var(--r);padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:0.86rem;box-shadow:0 2px 8px rgba(0,0,0,0.06);animation:slideDown 0.3s ease both;">
        <span>{{ message }}</span>
        <button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:1.1rem;line-height:1;padding:0 0 0 12px;transition:color 0.15s;" onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--ink-3)'">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
