{% load static %}
<nav class="navbar navbar-expand-lg site-nav">
    <div class="container">
        <a class="navbar-brand nav-brand" href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'signup' %}{% endif %}">
            Event<span>Echo</span>
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1 py-2 py-lg-0">
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active-link{% endif %}"
                           href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'add_event' %}active-link{% endif %}"
                           href="{% url 'add_event' %}">Add Event</a>
                    </li>
                    <li class="nav-item ms-lg-2 my-1 my-lg-0">
                        <span class="nav-user-chip">{{ user.username }}</span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'login' %}active-link{% endif %}"
                           href="{% url 'login' %}">Login</a>
                    </li>
                    <li class="nav-item ms-lg-2 my-1 my-lg-0">
                        <a href="{% url 'signup' %}" class="btn-primary" style="padding:7px 20px;font-size:0.83rem;">Sign Up</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
